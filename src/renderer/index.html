<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0f13" />
    <title>SysLens</title>
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand drag">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6aa8ff" />
                <stop offset="1" stop-color="#9b7bff" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bm)" />
            <rect x="8" y="17" width="3.2" height="7" rx="1.2" fill="#fff" opacity=".95" />
            <rect x="14.4" y="11" width="3.2" height="13" rx="1.2" fill="#fff" opacity=".95" />
            <rect x="20.8" y="14" width="3.2" height="10" rx="1.2" fill="#fff" opacity=".95" />
          </svg>
          <span>SysLens</span>
        </div>
        <nav class="nav" id="nav">
          <button class="nav-item" data-view="overview">
            <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z" /></svg>
            <span>Overview</span>
          </button>
          <button class="nav-item" data-view="processes">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z" /></svg>
            <span>Processes</span>
            <span class="nav-count" id="navProcCount"></span>
          </button>
          <button class="nav-item" data-view="memory">
            <svg viewBox="0 0 24 24"><path d="M6 4h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-1v3h-2v-3h-2v3h-2v-3H9v3H7v-3H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm1 3v7h2V7zm4 0v7h2V7zm4 0v7h2V7z" /></svg>
            <span>Memory</span>
          </button>
          <button class="nav-item" data-view="performance">
            <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-7 4 5v6H3z" opacity=".35" /><path d="M3 17l5-6 4 3 5-7 4 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
            <span>Performance</span>
          </button>
          <button class="nav-item" data-view="storage">
            <svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v5H4V5a1 1 0 0 1 1-1zm-1 8h16v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zm12 2.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM16 6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" /></svg>
            <span>Storage</span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <div class="foot-block">
            <div class="foot-label">Update speed</div>
            <div class="seg seg-sm" id="speed">
              <button data-ms="500">0.5s</button>
              <button data-ms="1000">1s</button>
              <button data-ms="2000">2s</button>
              <button data-ms="5000">5s</button>
              <button data-ms="0" title="Pause updates">❚❚</button>
            </div>
          </div>
          <div class="foot-block">
            <div class="foot-label">Theme</div>
            <div class="seg seg-sm" id="theme">
              <button data-theme="system">Auto</button>
              <button data-theme="light">Light</button>
              <button data-theme="dark">Dark</button>
            </div>
          </div>
          <div class="admin" id="admin"></div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar drag">
          <h1 id="viewTitle">Overview</h1>
          <div class="top-stats" id="topStats"></div>
        </header>
        <section class="view" id="view-overview"></section>
        <section class="view" id="view-processes"></section>
        <section class="view" id="view-memory"></section>
        <section class="view" id="view-performance"></section>
        <section class="view" id="view-storage"></section>
      </main>
    </div>
    <div class="tooltip" id="tooltip"></div>
    <div id="modalRoot"></div>
    <div class="toasts" id="toasts"></div>
    <div class="offline" id="offline" role="status" aria-live="polite">
      <div class="offline-msg">
        <span id="offlineText">Connection lost. Reconnecting…</span>
        <span class="offline-hint" id="offlineHint" hidden></span>
      </div>
      <button type="button" class="offline-btn" id="offlineRetry">Retry now</button>
    </div>
    <script src="js/bridge.js"></script>
    <script src="js/util.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/treemap.js"></script>
    <script src="js/views/overview.js"></script>
    <script src="js/views/processes.js"></script>
    <script src="js/views/memory.js"></script>
    <script src="js/views/performance.js"></script>
    <script src="js/views/storage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
